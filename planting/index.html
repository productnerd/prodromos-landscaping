<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodromos Planting Plan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%233D5A3E'/%3E%3Cpath d='M16 6c-2 4-6 8-6 12a6 6 0 0012 0c0-4-4-8-6-12z' fill='%238B9E7E'/%3E%3Cpath d='M16 12v14' stroke='%23F5F0E8' stroke-width='1.5' fill='none'/%3E%3Cpath d='M16 16c-2-1.5-4-1-5 0' stroke='%23F5F0E8' stroke-width='1.2' fill='none'/%3E%3Cpath d='M16 19c2-1.5 3.5-1 4.5 0' stroke='%23F5F0E8' stroke-width='1.2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #F5F0E8;
  --paper: #FAF7F2;
  --sage: #8B9E7E;
  --sage-light: #C5D1BC;
  --forest: #3D5A3E;
  --forest-deep: #2A3F2B;
  --terracotta: #C17849;
  --terracotta-light: #E8C4A8;
  --ink: #3B3228;
  --ink-light: #6B5E52;
  --warm-gray: #A89E94;
  --divider: #D9D0C5;
  --section-trees: #5C7A52;
  --section-shrubs: #7B8E6B;
  --section-climbers: #8E7B6B;
  --section-cane: #9B6B7B;
  --section-perennials: #6B8E8B;
  --section-bulbs: #8B7B6B;
  --section-grasses: #6B7B5C;
  --section-seasonal: #B8956B;
}

body {
  font-family: 'Spectral', Georgia, serif;
  background-color: var(--cream);
  color: var(--ink);
  line-height: 1.5;
  font-size: 15px;
  min-height: 100vh;
  background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

header {
  text-align: center;
  padding: 2.5rem 1.5rem 1.5rem;
  border-bottom: 1px solid var(--divider);
  background: linear-gradient(180deg, var(--paper) 0%, var(--cream) 100%);
}

header h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  color: var(--forest-deep);
  letter-spacing: -0.02em;
  margin-bottom: 0.25rem;
}

header .subtitle {
  font-family: 'Spectral', Georgia, serif;
  font-style: italic;
  color: var(--ink-light);
  font-size: 0.95rem;
  font-weight: 300;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.5rem;
  background: var(--paper);
  border-bottom: 1px solid var(--divider);
  position: sticky;
  top: 0;
  z-index: 100;
}

.counter {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 1.05rem;
  color: var(--forest);
  white-space: nowrap;
}

.counter span {
  color: var(--terracotta);
  font-weight: 700;
}

.toolbar-spacer { flex: 1; }

.btn {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.4rem 0.9rem;
  border: 1px solid var(--divider);
  border-radius: 4px;
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.btn:hover { background: var(--cream); border-color: var(--warm-gray); }
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--forest);
  color: var(--paper);
  border-color: var(--forest);
}
.btn-primary:hover { background: var(--forest-deep); }

.btn-accent {
  background: var(--terracotta);
  color: var(--paper);
  border-color: var(--terracotta);
}
.btn-accent:hover { background: #A8623A; }

.toggle-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: var(--ink-light);
  cursor: pointer;
  user-select: none;
}

.toggle-wrap input[type="checkbox"] {
  accent-color: var(--forest);
  width: 16px;
  height: 16px;
  cursor: pointer;
}

.search-box {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.85rem;
  padding: 0.4rem 0.75rem;
  border: 1px solid var(--divider);
  border-radius: 4px;
  background: var(--paper);
  color: var(--ink);
  width: 180px;
  outline: none;
}
.search-box:focus { border-color: var(--sage); }
.search-box::placeholder { color: var(--warm-gray); }

main { padding: 0 1.5rem 3rem; max-width: 1400px; margin: 0 auto; }

.section-group { margin-top: 1.5rem; }

.section-banner {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 1.15rem;
  padding: 0.6rem 1rem;
  border-radius: 6px;
  color: #fff;
  margin-bottom: 0.5rem;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.section-banner .section-count {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.75rem;
  font-weight: 400;
  opacity: 0.8;
  margin-left: auto;
}

.plant-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.85rem;
}

.plant-table thead th {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-light);
  padding: 0.5rem 0.6rem;
  border-bottom: 2px solid var(--divider);
  text-align: left;
  position: sticky;
  top: 52px;
  background: var(--cream);
  z-index: 10;
  white-space: nowrap;
}

.plant-table tbody tr {
  transition: background 0.1s;
}

.plant-table tbody tr:hover {
  background: rgba(139, 158, 126, 0.08);
}

.plant-table tbody tr.is-annual {
  border-left: 3px solid var(--terracotta);
}

.plant-table tbody td {
  padding: 0.45rem 0.6rem;
  border-bottom: 1px solid var(--divider);
  vertical-align: top;
  line-height: 1.45;
}

.plant-table tbody tr.is-annual td:first-child {
  padding-left: calc(0.6rem - 3px);
}

.cell-plant {
  font-weight: 500;
  color: var(--forest-deep);
  min-width: 140px;
}

.cell-notes {
  min-width: 140px;
}

.cell-notes textarea {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.82rem;
  width: 100%;
  min-height: 28px;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  color: var(--ink);
  resize: vertical;
  line-height: 1.4;
  transition: border-color 0.15s, background 0.15s;
}

.cell-notes textarea:hover { border-color: var(--divider); background: var(--paper); }
.cell-notes textarea:focus { border-color: var(--sage); background: var(--paper); outline: none; }

.cell-check {
  text-align: center;
  width: 40px;
}

.cell-check input[type="checkbox"] {
  accent-color: var(--forest);
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.annual-badge {
  display: inline-block;
  font-family: 'Fraunces', Georgia, serif;
  font-size: 0.65rem;
  font-weight: 500;
  background: var(--terracotta-light);
  color: var(--terracotta);
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
  vertical-align: middle;
}

.season-dot {
  text-align: center;
  font-size: 0.8rem;
  background: rgba(139, 158, 126, 0.06);
  width: 55px;
  min-width: 55px;
}

.season-first {
  border-left: 2px solid var(--sage-light);
}

.season-last {
  border-right: 2px solid var(--sage-light);
}

.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--warm-gray);
  font-style: italic;
}

footer {
  text-align: center;
  padding: 1.5rem;
  border-top: 1px solid var(--divider);
  color: var(--warm-gray);
  font-size: 0.8rem;
  font-style: italic;
}

/* Card layout for mobile */
@media (max-width: 900px) {
  .toolbar { padding: 0.75rem 1rem; gap: 0.5rem; }
  main { padding: 0 0.75rem 2rem; }

  .plant-table, .plant-table thead, .plant-table tbody,
  .plant-table th, .plant-table tr, .plant-table td {
    display: block;
  }
  .plant-table thead { display: none; }
  .plant-table tbody tr {
    background: var(--paper);
    border: 1px solid var(--divider);
    border-radius: 6px;
    padding: 0.75rem;
    margin-bottom: 0.5rem;
  }
  .plant-table tbody tr:hover { background: var(--paper); }
  .plant-table tbody tr.is-annual { border-left: 3px solid var(--terracotta); }
  .plant-table tbody td { border: none; padding: 0.2rem 0; }
  .plant-table tbody td::before {
    content: attr(data-label);
    font-family: 'Fraunces', Georgia, serif;
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--warm-gray);
    display: block;
    margin-bottom: 1px;
  }
  .cell-check { text-align: left; width: auto; }
  .cell-notes textarea { min-height: 36px; }
  .card-top {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.3rem;
  }
}

/* Print styles */
@media print {
  header { padding: 1rem; }
  .toolbar, .btn, .toggle-wrap, .search-box, footer, .cell-notes, .cell-check, .soil-prep, .page-nav { display: none !important; }
  .shopping details { border: none; }
  .shopping summary { color: var(--forest-deep); background: none !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .plant-table thead th { position: static; background: #fff; }
  .section-banner { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .plant-table tbody tr { page-break-inside: avoid; }
  .plant-table tbody tr.print-hide { display: none !important; }
  .section-group.print-hide { display: none !important; }
  body { background: #fff; font-size: 11px; }
  main { padding: 0; max-width: 100%; }
  .print-show { display: table-cell !important; }
}

.row-selected {
  background: rgba(139, 158, 126, 0.15) !important;
  box-shadow: inset 3px 0 0 var(--forest);
}

.row-good {
  background: rgba(139, 158, 126, 0.12) !important;
}

.row-good td:first-child::before {
  content: '🤝';
  margin-right: 4px;
}

.row-bad {
  background: rgba(193, 120, 73, 0.1) !important;
}

.row-bad td:first-child::before {
  content: '⚠️';
  margin-right: 4px;
}

.companion-hint {
  display: none;
  font-size: 0.8rem;
  color: var(--ink-light);
  font-style: italic;
  padding: 0.4rem 1rem;
}

.companion-hint.show { display: block; }

.hidden { display: none !important; }

.page-nav {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  margin-top: 0.9rem;
}

.page-nav a {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.35rem 0.9rem;
  border: 1px solid var(--divider);
  border-radius: 4px;
  background: var(--paper);
  color: var(--ink);
  text-decoration: none;
  transition: all 0.15s ease;
}
.page-nav a:hover { background: var(--cream); border-color: var(--warm-gray); }
.page-nav a[aria-current="page"] {
  background: var(--forest);
  border-color: var(--forest);
  color: var(--paper);
}

.cell-plant .botanical {
  display: block;
  font-size: 0.75rem;
  font-style: italic;
  font-weight: 400;
  color: var(--ink-light);
}

.shopping {
  max-width: 1400px;
  margin: 1.5rem auto 0;
  padding: 0 1.5rem;
}

.shopping details {
  background: var(--paper);
  border: 1px solid var(--divider);
  border-radius: 6px;
}

.shopping summary,
.soil-prep summary {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 1.15rem;
  color: var(--paper);
  padding: 0.6rem 1rem;
  border-radius: 6px;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.shopping summary { background: var(--forest); }

.shopping summary::-webkit-details-marker { display: none; }
.shopping summary::before { content: '▸'; font-size: 0.9rem; transition: transform 0.15s; }
.shopping details[open] summary::before { transform: rotate(90deg); }
.shopping details[open] summary { border-radius: 6px 6px 0 0; }

.shopping .shop-count {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.75rem;
  font-weight: 400;
  opacity: 0.85;
  margin-left: auto;
}

.shop-grid {
  padding: 1rem 1.25rem 1.25rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 1rem 1.5rem;
}

.shop-month h3 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 1rem;
  color: var(--forest-deep);
  padding-bottom: 0.25rem;
  border-bottom: 1px solid var(--divider);
  margin-bottom: 0.4rem;
}

.shop-label {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-light);
  margin: 0.45rem 0 0.15rem;
}

.shop-month ul { list-style: none; }
.shop-month li { font-size: 0.85rem; padding: 1px 0; }
.shop-month .shop-meta {
  display: block;
  font-size: 0.72rem;
  font-style: italic;
  color: var(--warm-gray);
}
.shop-month ul.shop-plant li { color: var(--ink-light); }

.view-switch { display: flex; gap: 0; }
.view-switch .btn:first-child { border-radius: 4px 0 0 4px; }
.view-switch .btn:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
.view-switch .btn[aria-pressed="true"] {
  background: var(--forest);
  border-color: var(--forest);
  color: var(--paper);
}

#calendar { padding: 0 1.5rem 3rem; max-width: 1400px; margin: 0 auto; }

.cal-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  margin: 1.25rem 0 0.75rem;
  font-size: 0.82rem;
  color: var(--ink-light);
}
.cal-legend span { display: flex; align-items: center; gap: 0.35rem; }

.cal-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.85rem;
}

.cal-table th {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-light);
  padding: 0.5rem 0.3rem;
  border-bottom: 2px solid var(--divider);
  background: var(--cream);
  position: sticky;
  top: 52px;
  z-index: 10;
}
.cal-table th.cal-plant-head { text-align: left; padding-left: 0.6rem; min-width: 190px; }
.cal-table th.is-now { color: var(--paper); background: var(--forest); border-radius: 4px 4px 0 0; }

.cal-table td {
  border-bottom: 1px solid var(--divider);
  padding: 0.3rem;
  text-align: center;
  vertical-align: middle;
}

.cal-table td.cal-plant {
  text-align: left;
  padding-left: 0.6rem;
  font-weight: 500;
  color: var(--forest-deep);
  white-space: nowrap;
}
.cal-table td.cal-plant .cal-window {
  display: block;
  font-size: 0.72rem;
  font-weight: 400;
  font-style: italic;
  color: var(--warm-gray);
}

.cal-table tbody tr:hover td { background: rgba(139, 158, 126, 0.08); }
.cal-table td.is-now { background: rgba(61, 90, 62, 0.07); }

.cal-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 22px;
  border-radius: 3px;
  font-size: 0.8rem;
}
.cal-yes { background: var(--sage-light); color: var(--forest-deep); }
.cal-no {
  color: var(--warm-gray);
  opacity: 0.5;
  font-size: 0.7rem;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 3px,
    rgba(168, 158, 148, 0.16) 3px,
    rgba(168, 158, 148, 0.16) 5px
  );
}
.cal-best {
  background: var(--forest);
  color: var(--paper);
  font-weight: 700;
  box-shadow: 0 0 0 2px var(--terracotta-light);
}

.cal-section-row td {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 0.9rem;
  color: var(--paper);
  text-align: left !important;
  padding: 0.35rem 0.6rem;
}

.cal-total-row td {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  color: var(--forest-deep);
  border-top: 2px solid var(--divider);
  border-bottom: none;
  padding-top: 0.5rem;
}
.cal-total-row td.cal-plant { color: var(--ink-light); font-size: 0.8rem; }
.cal-load {
  display: inline-block;
  min-width: 22px;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--cream);
}
.cal-load.busy { background: var(--terracotta-light); color: var(--terracotta); }

.cal-row-unpicked td.cal-plant { color: var(--warm-gray); font-weight: 400; }

@media (max-width: 900px) {
  #calendar { padding: 0 0.75rem 2rem; overflow-x: auto; }
  .cal-table { min-width: 720px; }
}

.shop-qty {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 0.72rem;
  font-weight: 500;
  background: var(--sage-light);
  color: var(--forest-deep);
  padding: 0 5px;
  border-radius: 3px;
}

.soil-prep {
  max-width: 1400px;
  margin: 1.5rem auto 0;
  padding: 0 1.5rem;
}

.soil-prep details {
  background: var(--paper);
  border: 1px solid var(--divider);
  border-radius: 6px;
}

.soil-prep summary {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 1.15rem;
  color: var(--paper);
  background: var(--terracotta);
  padding: 0.6rem 1rem;
  border-radius: 6px;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.soil-prep summary::-webkit-details-marker { display: none; }
.soil-prep summary::before { content: '▸'; font-size: 0.9rem; transition: transform 0.15s; }
.soil-prep details[open] summary::before { transform: rotate(90deg); }
.soil-prep details[open] summary { border-radius: 6px 6px 0 0; }

.soil-prep .soil-count {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.75rem;
  font-weight: 400;
  opacity: 0.85;
  margin-left: auto;
}

.soil-body {
  padding: 1rem 1.25rem 1.25rem;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 1rem 2rem;
}

.soil-step h3 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  font-size: 1rem;
  color: var(--forest-deep);
  margin-bottom: 0.4rem;
  padding-bottom: 0.25rem;
  border-bottom: 1px solid var(--divider);
}

.soil-item {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  padding: 0.3rem 0;
  font-size: 0.88rem;
  cursor: pointer;
  line-height: 1.4;
}

.soil-item input[type="checkbox"] {
  accent-color: var(--forest);
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
}

.soil-item.done { color: var(--warm-gray); text-decoration: line-through; }
.soil-item .soil-note {
  display: block;
  font-size: 0.8rem;
  font-style: italic;
  color: var(--ink-light);
  margin-top: 2px;
}
.soil-item.done .soil-note { color: var(--warm-gray); }

@media (max-width: 900px) {
  .soil-prep, .shopping { padding: 0 0.75rem; }
}

.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--forest-deep);
  color: var(--paper);
  padding: 0.6rem 1.2rem;
  border-radius: 6px;
  font-size: 0.85rem;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 1000;
